{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "minikernel.fullname" . }}-data
  labels:
    {{- include "minikernel.labels" . | nindent 4 }}
    component: data
spec:
  accessModes:
    - {{ .Values.persistence.data.accessMode }}
  {{- if .Values.persistence.data.storageClass }}
  storageClassName: {{ .Values.persistence.data.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "minikernel.fullname" . }}-logs
  labels:
    {{- include "minikernel.labels" . | nindent 4 }}
    component: logs
spec:
  accessModes:
    - {{ .Values.persistence.logs.accessMode }}
  {{- if .Values.persistence.logs.storageClass }}
  storageClassName: {{ .Values.persistence.logs.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.logs.size }}

{{- if .Values.minikernel.llm.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "minikernel.fullname" . }}-models
  labels:
    {{- include "minikernel.labels" . | nindent 4 }}
    component: models
spec:
  accessModes:
    - {{ .Values.persistence.models.accessMode }}
  {{- if .Values.persistence.models.storageClass }}
  storageClassName: {{ .Values.persistence.models.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.models.size }}
{{- end }}
{{- end }}
