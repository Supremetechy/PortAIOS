# Default values for MiniKernel Helm chart
# This is a YAML-formatted file.

# Number of replicas
replicaCount: 1

# Image configuration
image:
  repository: minikernel
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

# Container security context
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

# Service configuration
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: minikernel.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: minikernel-tls
    #   hosts:
    #     - minikernel.example.com

# Resource limits and requests
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# MiniKernel specific configuration
minikernel:
  # Operation mode: text or voice
  mode: text
  
  # Log level: DEBUG, INFO, WARNING, ERROR
  logLevel: INFO
  
  # Confirmation mode: text, voice, auto
  confirmationMode: text
  
  # Enable LLM inference (requires GPU)
  llm:
    enabled: false
    model: "llama-3-8b-q4.gguf"
    contextSize: 2048
    threads: 4
    gpuLayers: 0
  
  # Capabilities to grant to AI agent
  capabilities:
    fileRead: true
    fileWrite: false
    fileDelete: false
    processList: true
    processKill: false
    packageInstall: false
    systemInfo: true

# Persistence configuration
persistence:
  enabled: true
  
  # Data volume
  data:
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    mountPath: /opt/minikernel/data
  
  # Logs volume
  logs:
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 500Mi
    mountPath: /opt/minikernel/logs
  
  # Models volume (for LLM models)
  models:
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi
    mountPath: /opt/minikernel/models

# Probes configuration
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

# Additional environment variables
env: []
  # - name: CUSTOM_VAR
  #   value: "custom_value"

# ConfigMap data
configMap:
  create: true
  data: {}

# Secret data
secret:
  create: false
  data: {}
