# Complete Docker Compose Stack with Monitoring
# Includes: MiniKernel, Prometheus, Grafana, Loki

version: '3.8'

services:
  # MiniKernel Main Service
  minikernel:
    image: minikernel:latest
    container_name: minikernel
    build:
      context: ../../..
      dockerfile: minikernel/deploy/docker/Dockerfile
    
    environment:
      - MINIKERNEL_MODE=text
      - MINIKERNEL_LOG_LEVEL=INFO
      - MINIKERNEL_CONFIRMATION=text
    
    volumes:
      - minikernel-data:/opt/minikernel/data
      - minikernel-logs:/opt/minikernel/logs
    
    ports:
      - "8080:8080"
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.path.insert(0, '/opt/minikernel'); from minikernel.core.microkernel import MicroKernel; print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    networks:
      - minikernel-network
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  
  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    
    ports:
      - "9090:9090"
    
    restart: unless-stopped
    
    networks:
      - minikernel-network
  
  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    
    ports:
      - "3000:3000"
    
    restart: unless-stopped
    
    depends_on:
      - prometheus
    
    networks:
      - minikernel-network
  
  # Loki Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: loki
    
    ports:
      - "3100:3100"
    
    volumes:
      - loki-data:/loki
    
    command: -config.file=/etc/loki/local-config.yaml
    
    restart: unless-stopped
    
    networks:
      - minikernel-network
  
  # Promtail Log Shipper
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    
    volumes:
      - minikernel-logs:/var/log/minikernel:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    
    command: -config.file=/etc/promtail/config.yml
    
    restart: unless-stopped
    
    depends_on:
      - loki
    
    networks:
      - minikernel-network
  
  # Redis Cache (optional)
  redis:
    image: redis:alpine
    container_name: redis
    
    ports:
      - "6379:6379"
    
    volumes:
      - redis-data:/data
    
    restart: unless-stopped
    
    networks:
      - minikernel-network
    
    profiles:
      - cache

volumes:
  minikernel-data:
    driver: local
  minikernel-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  redis-data:
    driver: local

networks:
  minikernel-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
