<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIOS Onboarding - Lip-Sync Avatar</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #agent-avatar {
            position: relative;
            width: 100%;
            height: 500px;
            background: #000;
            border: 2px solid var(--primary-color, #0f0);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        #lipsync-avatar-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #avatar-status {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #0f0;
            padding: 5px 10px;
            font-size: 0.8rem;
            color: #0f0;
            z-index: 10;
        }

        #avatar-status .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
            background: #0f0;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .lipsync-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #0ff;
            padding: 8px 12px;
            font-size: 0.75rem;
            color: #0ff;
            z-index: 10;
        }

        .lipsync-info .viseme-display {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>AIOS Setup Wizard</h1>
            <div id="progress-bar"></div>
        </header>
        <main>
            <div id="agent-avatar">
                <!-- Lip-Sync Avatar Container -->
                <div id="lipsync-avatar-container"></div>
                
                <!-- Status Indicator -->
                <div id="avatar-status">
                    <span class="status-dot"></span>
                    <span id="avatar-status-text">Initializing...</span>
                </div>
                
                <!-- Lip-Sync Info -->
                <div class="lipsync-info">
                    <div>Lip-Sync: <span id="lipsync-mode">Loading...</span></div>
                    <div class="viseme-display" id="current-viseme">—</div>
                </div>
            </div>
            
            <div id="onboarding-content">
                <h2>Welcome to AIOS!</h2>
                <p>I am your personal AI Agent with advanced lip-sync. Let's get you set up.</p>
                <p class="voice-hint">💡 Say "Hey AIOS" to use voice commands</p>
                <button id="next-button">Next →</button>
            </div>
        </main>
    </div>

    <!-- Voice UI Container -->
    <div id="voice-ui-container"></div>

    <!-- Eel JavaScript bridge -->
    <script type="text/javascript" src="/eel.js"></script>
    
    <!-- Lip-Sync Avatar System -->
    <script type="module">
        import { LipSyncAvatar } from './avatar-3d-lipsync.js';
        import { VoiceInputController } from './voice-input.js';
        import { VoiceUI } from './voice-ui.js';
        import { ExtendedVoiceCommands } from './voice-commands-extended.js';

        // Global AIOS namespace
        window.AIOS = window.AIOS || {};

        // State management
        let currentStep = 0;
        let awaitingVoiceResponse = false;

        // Initialize Lip-Sync Avatar
        async function initLipSyncAvatar() {
            console.log('[AIOS] Initializing Lip-Sync Avatar...');
            
            const container = document.getElementById('lipsync-avatar-container');
            const statusText = document.getElementById('avatar-status-text');
            const lipsyncMode = document.getElementById('lipsync-mode');
            
            try {
                // Create lip-sync avatar (will use binary fallback if no 3D model)
                window.AIOS.avatar = new LipSyncAvatar(container, {
                    modelUrl: null,  // No 3D model URL = use binary fallback
                    useBinaryFallback: true
                });

                statusText.textContent = 'Online';
                lipsyncMode.textContent = 'Binary + Phoneme';
                
                console.log('[AIOS] Lip-Sync Avatar initialized');

                // Initialize voice system
                initVoiceSystem();

                // Test speech with lip-sync
                setTimeout(() => {
                    testLipSync();
                }, 2000);

            } catch (error) {
                console.error('[AIOS] Avatar initialization failed:', error);
                statusText.textContent = 'Fallback Mode';
                lipsyncMode.textContent = 'Basic';
            }
        }

        // Initialize voice input system
        function initVoiceSystem() {
            console.log('[AIOS] Initializing Voice System...');

            if (!VoiceInputController.isSupported()) {
                console.warn('[AIOS] Voice input not supported');
                return;
            }

            // Create voice UI
            window.AIOS.voiceUI = new VoiceUI(
                document.getElementById('voice-ui-container'),
                {
                    position: 'bottom-center',
                    showTranscript: true,
                    showWaveform: true
                }
            );

            // Create voice controller
            window.AIOS.voiceInput = new VoiceInputController({
                wakeWords: ['hey aios', 'aios', 'computer'],
                continuous: true,
                autoStart: false,
                
                onCommand: (commandData) => {
                    handleVoiceCommand(commandData.command);
                },
                
                onWakeWord: () => {
                    speakWithLipSync("Yes? How can I help you?");
                },
                
                onStateChange: (state) => {
                    window.AIOS.voiceUI.setState(state);
                }
            });

            // Mic button handler
            window.AIOS.voiceUI.onMicClick(() => {
                requestMicrophonePermission();
            });
        }

        // Request microphone permission
        async function requestMicrophonePermission() {
            try {
                const hasPermission = await VoiceInputController.requestPermission();
                if (hasPermission) {
                    window.AIOS.voiceInput.start();
                } else {
                    alert('Microphone permission is required for voice input');
                }
            } catch (error) {
                console.error('[AIOS] Microphone permission error:', error);
            }
        }

        // Handle voice commands
        function handleVoiceCommand(command) {
            console.log('[AIOS] Voice command:', command);
            
            // Process through Eel if available
            if (typeof eel !== 'undefined') {
                eel.process_voice_command(command, { step: currentStep })().then(result => {
                    console.log('[AIOS] Command result:', result);
                });
            }
        }

        // Speak with lip-sync (uses Piper backend if available)
        async function speakWithLipSync(text) {
            console.log('[AIOS] Speaking with lip-sync:', text);
            
            // This will trigger Piper TTS which sends phoneme data back
            if (typeof eel !== 'undefined') {
                // Backend will handle TTS and send phoneme data via receive_viseme_data
                try {
                    await eel.speak_with_lipsync(text)();
                } catch (error) {
                    console.warn('[AIOS] Backend TTS failed, using browser:', error);
                    // Fallback to browser TTS
                    const utterance = new SpeechSynthesisUtterance(text);
                    window.speechSynthesis.speak(utterance);
                }
            }
        }

        // Expose speak function for global use
        window.speakText = speakWithLipSync;

        // Test lip-sync
        function testLipSync() {
            console.log('[AIOS] Testing lip-sync...');
            speakWithLipSync("Welcome to AIOS. Initializing lip sync system.");
        }

        // Viseme display update
        window.receive_viseme_data = function(payload) {
            console.log('[AIOS] Received viseme data:', payload);
            
            // Update viseme display
            if (payload.phonemes && payload.phonemes.length > 0) {
                updateVisemeDisplay(payload.phonemes);
            }
        };

        function updateVisemeDisplay(phonemes) {
            const display = document.getElementById('current-viseme');
            let index = 0;
            
            function updateNext() {
                if (index < phonemes.length) {
                    const phoneme = phonemes[index];
                    display.textContent = `${phoneme.v || phoneme.p} (${phoneme.d.toFixed(2)}s)`;
                    
                    const delay = phoneme.d * 1000;
                    setTimeout(updateNext, delay);
                    index++;
                } else {
                    display.textContent = '—';
                }
            }
            
            updateNext();
        }

        // Expose to Eel
        if (typeof eel !== 'undefined') {
            eel.expose(window.receive_viseme_data, 'receive_viseme_data');
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initLipSyncAvatar);
        } else {
            initLipSyncAvatar();
        }

        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (window.AIOS?.avatar) {
                window.AIOS.avatar.destroy();
            }
            if (window.AIOS?.voiceInput) {
                window.AIOS.voiceInput.destroy();
            }
            if (window.AIOS?.voiceUI) {
                window.AIOS.voiceUI.destroy();
            }
        });
    </script>

    <!-- Original AIOS Script -->
    <script type="text/javascript" src="script.js"></script>
</body>
</html>
