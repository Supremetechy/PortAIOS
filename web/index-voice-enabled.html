<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIOS Onboarding - Voice Enabled</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Binary Avatar specific styles */
        #agent-avatar {
            position: relative;
            width: 100%;
            height: 500px;
            background: #000;
            border: 2px solid var(--primary-color, #0f0);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        #binary-avatar-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #avatar-video {
            display: none;
        }

        #binary-avatar-container:not(:empty) ~ #avatar-placeholder {
            display: none !important;
        }

        #avatar-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0f0;
            font-size: 1.5rem;
            text-align: center;
        }

        #avatar-status {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #0f0;
            padding: 5px 10px;
            font-size: 0.8rem;
            color: #0f0;
            z-index: 10;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
            background: #0f0;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Onboarding content enhancements */
        .response-options {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .response-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #0f0;
            color: #0f0;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.2s;
        }

        .response-btn:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .voice-hint {
            margin-top: 10px;
            padding: 8px 12px;
            background: rgba(0, 255, 255, 0.1);
            border-left: 3px solid #0ff;
            color: #0ff;
            font-size: 0.9rem;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>AIOS Setup Wizard</h1>
            <div id="progress-bar"></div>
        </header>
        <main>
            <div id="agent-avatar">
                <div id="binary-avatar-container"></div>
                <div id="avatar-status">
                    <span class="status-dot"></span>
                    <span id="avatar-status-text">Initializing...</span>
                </div>
                <div id="avatar-placeholder" style="display: none;">
                    🤖 AI Assistant (WebGL required)
                </div>
                <video id="avatar-video" style="display: none;"></video>
            </div>
            <div id="onboarding-content">
                <h2>Welcome to AIOS!</h2>
                <p>I am your personal AI Agent. Let's get you set up.</p>
                <p class="voice-hint">💡 Say "Hey AIOS" to use voice commands</p>
                <button id="next-button">Next →</button>
            </div>
        </main>
    </div>

    <!-- Voice UI Container -->
    <div id="voice-ui-container"></div>

    <!-- Eel JavaScript bridge -->
    <script type="text/javascript" src="/eel.js"></script>
    
    <!-- Voice System Integration -->
    <script type="module">
        import { AvatarController } from './avatar-controller.js';
        import { VoiceInputController, VoiceCommandParser } from './voice-input.js';
        import { VoiceUI } from './voice-ui.js';

        // Global AIOS namespace
        window.AIOS = window.AIOS || {};

        // State management
        let currentStep = 0;
        let onboardingSteps = [];
        let awaitingVoiceResponse = false;
        let expectedResponseType = null;

        // Initialize binary avatar
        async function initBinaryAvatar() {
            console.log('[AIOS] Initializing Binary Avatar...');
            
            const container = document.getElementById('binary-avatar-container');
            const statusText = document.getElementById('avatar-status-text');
            
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                
                if (!gl) {
                    throw new Error('WebGL not supported');
                }

                const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                
                window.AIOS.avatar = new AvatarController(container, {
                    colorPalette: 'matrix',
                    digitCount: isMobile ? 3000 : 6000,
                    enableCRT: !isMobile,
                    enableChromatic: !isMobile,
                    enableBloom: true
                });

                statusText.textContent = 'Online';
                console.log('[AIOS] Binary Avatar initialized');

                // Initialize voice system after avatar is ready
                initVoiceSystem();

            } catch (error) {
                console.error('[AIOS] Avatar initialization failed:', error);
                statusText.textContent = 'Fallback Mode';
                document.getElementById('avatar-placeholder').style.display = 'block';
                
                // Still initialize voice even without avatar
                initVoiceSystem();
            }
        }

        // Initialize voice input system
        function initVoiceSystem() {
            console.log('[AIOS] Initializing Voice System...');

            // Check browser support
            if (!VoiceInputController.isSupported()) {
                console.warn('[AIOS] Voice input not supported in this browser');
                return;
            }

            // Create voice UI
            window.AIOS.voiceUI = new VoiceUI(
                document.getElementById('voice-ui-container'),
                {
                    position: 'bottom-center',
                    showTranscript: true,
                    showWaveform: true
                }
            );

            // Create voice controller
            window.AIOS.voiceInput = new VoiceInputController({
                wakeWords: ['hey aios', 'aios', 'computer'],
                continuous: true,
                autoStart: false,
                
                onTranscript: (data) => {
                    console.log('[Voice] Transcript:', data);
                    window.AIOS.voiceUI.updateTranscript(data.interim, data.final);
                },
                
                onCommand: (commandData) => {
                    console.log('[Voice] Command received:', commandData.command);
                    handleVoiceCommand(commandData.command);
                },
                
                onWakeWord: () => {
                    console.log('[Voice] Wake word detected!');
                    if (window.AIOS.avatar) {
                        window.AIOS.avatar.speak("Yes? How can I help you?", { emotion: 'happy' });
                    }
                    showCurrentStepHints();
                },
                
                onStateChange: (state) => {
                    console.log('[Voice] State changed:', state);
                    window.AIOS.voiceUI.setState(state);
                },
                
                onError: (error) => {
                    console.error('[Voice] Error:', error);
                    window.AIOS.voiceUI.setState('error');
                }
            });

            // Link voice controller to avatar
            if (window.AIOS.avatar) {
                window.AIOS.voiceInput.setAvatar(window.AIOS.avatar);
            }

            // Mic button click handler
            window.AIOS.voiceUI.onMicClick(() => {
                if (window.AIOS.voiceInput.isListening) {
                    window.AIOS.voiceInput.stop();
                } else {
                    requestMicrophonePermission();
                }
            });

            console.log('[AIOS] Voice System initialized');
        }

        // Request microphone permission
        async function requestMicrophonePermission() {
            try {
                const hasPermission = await VoiceInputController.requestPermission();
                
                if (hasPermission) {
                    window.AIOS.voiceInput.start();
                } else {
                    if (window.AIOS.avatar) {
                        window.AIOS.avatar.speak("I need microphone permission to hear your voice commands.", { emotion: 'neutral' });
                    }
                    alert('Microphone permission is required for voice input');
                }
            } catch (error) {
                console.error('[AIOS] Microphone permission error:', error);
            }
        }

        // Handle voice commands
        function handleVoiceCommand(command) {
            const parsed = VoiceCommandParser.parse(command);
            console.log('[AIOS] Parsed command:', parsed);

            // If we're awaiting a specific response
            if (awaitingVoiceResponse) {
                handleVoiceResponse(parsed, command);
                return;
            }

            // Handle general navigation commands
            switch (parsed.type) {
                case 'next':
                    nextStep();
                    break;
                
                case 'back':
                    previousStep();
                    break;
                
                case 'yes':
                    handleYesResponse();
                    break;
                
                case 'no':
                    handleNoResponse();
                    break;
                
                case 'help':
                    provideHelp();
                    break;
                
                case 'repeat':
                    repeatCurrentStep();
                    break;
                
                case 'input':
                    // Extract the input value
                    if (parsed.params.length > 0) {
                        handleTextInput(parsed.params[0]);
                    }
                    break;
                
                default:
                    // Check if it's a custom command for current step
                    handleCustomCommand(command);
            }
        }

        // Handle voice response to specific questions
        function handleVoiceResponse(parsed, rawCommand) {
            if (expectedResponseType === 'yes_no') {
                if (parsed.type === 'yes') {
                    handleYesResponse();
                } else if (parsed.type === 'no') {
                    handleNoResponse();
                } else {
                    if (window.AIOS.avatar) {
                        window.AIOS.avatar.speak("Please say yes or no.", { emotion: 'neutral' });
                    }
                }
            } else if (expectedResponseType === 'text') {
                handleTextInput(rawCommand);
            }
        }

        // Show hints for current step
        function showCurrentStepHints() {
            const hints = getCurrentStepVoiceHints();
            if (hints && hints.length > 0) {
                window.AIOS.voiceUI.showHints(hints);
            }
        }

        // Get voice hints for current step
        function getCurrentStepVoiceHints() {
            // This would be populated from step data
            const defaultHints = [
                'next',
                'back',
                'help',
                'repeat that'
            ];

            if (awaitingVoiceResponse) {
                if (expectedResponseType === 'yes_no') {
                    return ['yes', 'no'];
                } else if (expectedResponseType === 'text') {
                    return ['type [your answer]'];
                }
            }

            return defaultHints;
        }

        // Navigation functions
        function nextStep() {
            if (window.AIOS.avatar) {
                window.AIOS.avatar.speak("Moving to the next step.", { emotion: 'neutral' });
            }
            // Trigger next button click
            document.getElementById('next-button')?.click();
        }

        function previousStep() {
            if (window.AIOS.avatar) {
                window.AIOS.avatar.speak("Going back.", { emotion: 'neutral' });
            }
            // Implement back functionality
            currentStep = Math.max(0, currentStep - 1);
            loadStep(currentStep);
        }

        function handleYesResponse() {
            console.log('[AIOS] Yes response');
            if (window.AIOS.avatar) {
                window.AIOS.avatar.speak("Okay!", { emotion: 'happy' });
            }
            // Implement yes action for current step
            awaitingVoiceResponse = false;
            expectedResponseType = null;
            nextStep();
        }

        function handleNoResponse() {
            console.log('[AIOS] No response');
            if (window.AIOS.avatar) {
                window.AIOS.avatar.speak("Understood.", { emotion: 'neutral' });
            }
            // Implement no action for current step
            awaitingVoiceResponse = false;
            expectedResponseType = null;
        }

        function provideHelp() {
            const helpText = "You can say commands like: next, back, yes, no, or repeat that. You can also say 'type' followed by your input.";
            
            if (window.AIOS.avatar) {
                window.AIOS.avatar.speak(helpText, { emotion: 'neutral' });
            }
            
            showCurrentStepHints();
        }

        function repeatCurrentStep() {
            if (window.AIOS.avatar && onboardingSteps[currentStep]) {
                const step = onboardingSteps[currentStep];
                window.AIOS.avatar.speak(step.speech || step.description, { emotion: 'neutral' });
            }
        }

        function handleTextInput(text) {
            console.log('[AIOS] Text input:', text);
            
            // Find active input field and populate it
            const activeInput = document.querySelector('input[type="text"]:focus, textarea:focus') ||
                               document.querySelector('input[type="text"], textarea');
            
            if (activeInput) {
                activeInput.value = text;
                
                if (window.AIOS.avatar) {
                    window.AIOS.avatar.speak(`I've entered: ${text}`, { emotion: 'neutral' });
                }
            }
            
            awaitingVoiceResponse = false;
            expectedResponseType = null;
        }

        function handleCustomCommand(command) {
            // Step-specific command handling would go here
            console.log('[AIOS] Custom command:', command);
            
            if (window.AIOS.avatar) {
                window.AIOS.avatar.speak("I'm not sure how to help with that. Try saying 'help' for available commands.", { emotion: 'neutral' });
            }
        }

        // Load onboarding step
        function loadStep(stepIndex) {
            // This would load step data from backend
            console.log('[AIOS] Loading step:', stepIndex);
            
            // Update hints for new step
            setTimeout(() => {
                showCurrentStepHints();
            }, 500);
        }

        // Expose functions for Eel backend
        window.speakText = async (text, emotion = 'neutral') => {
            if (window.AIOS.avatar) {
                await window.AIOS.avatar.speak(text, { emotion });
            }
        };

        window.setAvatarActivity = (activity) => {
            if (window.AIOS.avatar) {
                window.AIOS.avatar.renderer.setActivity(activity);
            }
        };

        window.setAvatarEmotion = (emotion) => {
            if (window.AIOS.avatar) {
                window.AIOS.avatar.setEmotion(emotion);
            }
        };

        window.requestVoiceInput = (type = 'text') => {
            awaitingVoiceResponse = true;
            expectedResponseType = type;
            
            if (type === 'yes_no') {
                window.AIOS.voiceUI.showHints(['yes', 'no']);
            } else {
                window.AIOS.voiceUI.showHints(['say your answer']);
            }
            
            // Make sure voice is listening
            if (!window.AIOS.voiceInput.isListening) {
                window.AIOS.voiceInput.start();
            }
        };

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initBinaryAvatar);
        } else {
            initBinaryAvatar();
        }

        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (window.AIOS?.avatar) {
                window.AIOS.avatar.destroy();
            }
            if (window.AIOS?.voiceInput) {
                window.AIOS.voiceInput.destroy();
            }
            if (window.AIOS?.voiceUI) {
                window.AIOS.voiceUI.destroy();
            }
        });
    </script>

    <!-- Original AIOS Script -->
    <script type="text/javascript" src="script.js"></script>
</body>
</html>
